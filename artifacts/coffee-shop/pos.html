<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Ember · POS Prototype</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{font-family:"DM Sans",sans-serif;color:#29231f;background:#eee5da;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #bc7947;outline-offset:2px}.shell{display:flex;min-height:100vh;padding:20px;gap:0;max-width:1600px;margin:auto}.rail{background:#231f1e;color:#e9dfd5;border-radius:28px 0 0 28px;width:92px;flex:none;display:flex;flex-direction:column;align-items:center;padding:26px 9px;gap:14px}.mark{font:600 27px Fraunces,serif;color:#f5b778;margin-bottom:28px}.nav{width:100%;border:0;background:transparent;color:#bfb3a9;border-radius:15px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:15px 4px;font-size:10px}.nav span{font-size:21px}.nav.active{background:#42332b;color:#fff}.nav:hover{background:#3c322e}.rail-bottom{margin-top:auto}.workspace{background:#faf8f5;border-radius:0 28px 28px 0;flex:1;min-width:0;padding:30px 32px}.top{display:flex;align-items:center;gap:20px;margin-bottom:30px}.top h1{font:600 30px Fraunces,serif;margin:0;min-width:170px}.search{flex:1;max-width:540px;border:1px solid #eee7df;background:#fff;border-radius:13px;padding:13px 17px}.staff{margin-left:auto;color:#776c63;font-size:13px}.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px}.categories{display:flex;gap:8px;overflow:auto;margin-bottom:24px;padding-bottom:4px}.category{border:0;border-radius:12px;padding:10px 17px;background:transparent;color:#756b63;white-space:nowrap}.category.active{background:#282321;color:#fff}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.product{background:#fff;border:1px solid #f0ebe5;border-radius:19px;padding:11px;box-shadow:0 8px 24px #3a2b1d08}.photo{height:130px;border-radius:13px;position:relative;overflow:hidden;background:#e6d9cb}.photo img{width:100%;height:100%;object-fit:cover}.add{position:absolute;right:9px;top:9px;background:#d77c36;border:0;border-radius:50%;width:36px;height:36px;color:white;font-size:23px;box-shadow:0 4px 12px #51321c33}.product-title{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin:12px 2px 7px;font-size:13px;font-weight:700}.product small{color:#8a8179;display:block;margin:0 2px 12px}.sizes{display:flex;gap:5px}.size{flex:1;border:1px solid #f0ebe5;background:#faf8f5;border-radius:8px;padding:8px 1px;font-size:10px;color:#71685f}.size.selected{background:#f7dfc7;border-color:#e7b783;color:#422c1d}.order{background:#fff;border:1px solid #eee8e2;border-radius:22px;padding:23px;box-shadow:0 12px 30px #3a2b1d0b;align-self:start;position:sticky;top:18px}.order-head{display:flex;justify-content:space-between;align-items:center}.order h2{font-size:18px;margin:0}.clear{border:0;background:transparent;color:#968a80;font-size:12px}.lines{margin-top:20px;min-height:170px;max-height:400px;overflow:auto}.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f4f0ec}.thumb{width:44px;height:44px;object-fit:cover;border-radius:9px}.line-info{flex:1;min-width:0}.line-info strong{font-size:12px;display:block}.line-info small{font-size:10px;color:#85786c}.qty{display:flex;align-items:center;gap:9px;font-size:12px}.qty button{width:25px;height:25px;border:1px solid #e7b98c;background:#fff;border-radius:50%;color:#a96732}.totals{border-top:1px dashed #ded7cf;padding-top:15px;margin-top:18px}.total-row{display:flex;justify-content:space-between;font-size:13px;margin:9px 0;color:#756b62}.grand{display:flex;justify-content:space-between;font-size:18px;font-weight:700;border-top:1px dashed #ded7cf;padding-top:18px;margin-top:18px}.checkout{width:100%;margin-top:22px;border:0;border-radius:12px;background:#292321;color:white;padding:15px;font-weight:600}.checkout:disabled{opacity:.4;cursor:not-allowed}.empty{color:#8c8076;text-align:center;padding:45px 5px;font-size:13px}.panel{padding:26px;background:white;border-radius:18px;border:1px solid #eee8e2}.panel h2{font:600 26px Fraunces,serif}.muted{color:#80766d}.pill{display:inline-block;padding:8px 12px;border-radius:100px;background:#f5e8d9;color:#7a4c2c;font-size:12px}.notice{margin-top:16px;color:#7b4d2d;font-size:12px;line-height:1.6}.mobile-menu{display:none}.inventory-table{width:100%;border-collapse:collapse}.inventory-table td,.inventory-table th{text-align:left;padding:15px;border-bottom:1px solid #eee8e2;font-size:13px}.inventory-table th{color:#80766d;font-weight:500}@media(max-width:1100px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}.main{grid-template-columns:minmax(0,1fr) 290px}.workspace{padding:24px}}@media(max-width:780px){.shell{padding:0}.rail{border-radius:0;width:68px;padding:18px 5px}.nav{font-size:9px}.workspace{border-radius:0;padding:18px}.main{grid-template-columns:1fr}.order{position:static}.top{flex-wrap:wrap}.top h1{min-width:0}.search{order:3;flex-basis:100%;max-width:none}.staff{margin-left:auto}.products{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:450px){.rail{width:54px}.nav span{font-size:17px}.nav{font-size:8px}.workspace{padding:13px}.products{gap:9px}.product{padding:7px}.photo{height:105px}.product-title{font-size:11px}.size{font-size:9px}.top h1{font-size:24px}}@media(prefers-reduced-motion:no-preference){button{transition:background-color .18s ease,transform .18s ease}button:active{transform:scale(.97)}}
</style></head>
<body><div class="shell"><aside class="rail" aria-label="POS navigation"><div class="mark">le.</div><button class="nav active" data-view="pos"><span>☕</span>POS</button><button class="nav" data-view="inventory"><span>▤</span>Inventory</button><button class="nav" data-view="orders"><span>≡</span>Orders</button><button class="nav" data-view="overview"><span>◫</span>Overview</button><button class="nav rail-bottom" data-view="settings"><span>⚙</span>Settings</button></aside><main class="workspace"><header class="top"><h1 id="heading">Coffee & more.</h1><input class="search" id="search" aria-label="Search products" placeholder="Search coffee, drinks, food…"><span class="staff">Cashier · Demo</span></header><div id="view"></div></main></div>
<script>
"use strict";
const products=[
{id:"espresso",name:"Espresso",category:"Espresso",price:130,image:"https://images.unsplash.com/photo-1510707577719-ae7c14805e3a?w=600&q=80",stock:24},
{id:"cold",name:"Cold Brew",category:"Cold Brew",price:155,image:"https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=600&q=80",stock:18},
{id:"cinnamon",name:"Cinnamon Latte",category:"Latte",price:175,image:"https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=600&q=80",stock:14},
{id:"cappuccino",name:"Cappuccino",category:"Cappuccino",price:150,image:"https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?w=600&q=80",stock:20},
{id:"mocha",name:"White Mocha",category:"Mocha",price:185,image:"https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?w=600&q=80",stock:12},
{id:"hazelnut",name:"Hazelnut Latte",category:"Latte",price:190,image:"https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=600&q=80",stock:16}
];
const sizes=[{label:"Tall",extra:0},{label:"Grande",extra:25},{label:"Venti",extra:45},{label:"Trenta",extra:65}];
let activeView="pos",category="All",query="",cart=[],orders=[],sizeChoice={};
const money=n=>"₱"+n.toFixed(2);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.view===activeView));document.getElementById("heading").textContent=({pos:"Coffee & more.",inventory:"Inventory.",orders:"Orders.",overview:"Overview.",settings:"Settings."})[activeView];document.getElementById("search").hidden=activeView!=="pos";const view=document.getElementById("view");if(activeView==="pos")renderPOS(view);else if(activeView==="inventory")view.innerHTML='<section class="panel"><span class="pill">Demo stock</span><h2>Product inventory</h2><p class="muted">Example quantities only. No shared or live stock data.</p><table class="inventory-table"><thead><tr><th>Product</th><th>Available</th><th>Price</th></tr></thead><tbody>'+products.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+p.stock+'</td><td>'+money(p.price)+'</td></tr>').join("")+'</tbody></table></section>';else if(activeView==="orders")view.innerHTML='<section class="panel"><span class="pill">This session only</span><h2>Completed demo orders</h2>'+ (orders.length?orders.map((o,i)=>'<p>Order #'+String(i+1).padStart(3,"0")+' · '+o.items+' items · <strong>'+money(o.total)+'</strong></p>').join(""):'<p class="muted">No orders completed yet.</p>')+'</section>';else view.innerHTML='<section class="panel"><span class="pill">Prototype</span><h2>'+esc(activeView==="overview"?"A calmer way to run your café.":"Your café, your workspace.")+'</h2><p class="muted">This section will connect to secure shop-specific accounts and backend data in the next phase.</p></section>'}
function renderPOS(view){const categories=["All","Espresso","Cappuccino","Latte","Mocha","Cold Brew"];const visible=products.filter(p=>(category==="All"||p.category===category)&&p.name.toLowerCase().includes(query.toLowerCase()));view.innerHTML='<div class="main"><section><div class="categories">'+categories.map(c=>'<button class="category '+(c===category?"active":"")+'" data-category="'+esc(c)+'">'+esc(c)+'</button>').join("")+'</div><div class="products">'+(visible.length?visible.map(p=>{const selected=sizeChoice[p.id]||"Tall";return '<article class="product"><div class="photo"><img loading="lazy" src="'+p.image+'" alt="'+esc(p.name)+'"><button class="add" data-add="'+p.id+'" aria-label="Add '+esc(p.name)+' to order">+</button></div><div class="product-title"><span>'+esc(p.name)+'</span><span>'+money(p.price)+'</span></div><small>Choose your cup size</small><div class="sizes">'+sizes.map(s=>'<button class="size '+(selected===s.label?"selected":"")+'" data-size="'+p.id+'" data-label="'+s.label+'" aria-pressed="'+(selected===s.label)+'">'+s.label+'</button>').join("")+'</div></article>'}).join(""):'<p class="muted">No drinks found.</p>')+'</div></section><aside class="order"><div class="order-head"><h2>Current order</h2><button class="clear" id="clear">Clear all</button></div><div class="lines">'+(cart.length?cart.map((item,i)=>{const p=products.find(p=>p.id===item.id);return '<div class="line"><img class="thumb" src="'+p.image+'" alt=""><div class="line-info"><strong>'+esc(p.name)+'</strong><small>'+item.size+' · '+money(p.price+sizes.find(s=>s.label===item.size).extra)+'</small></div><div class="qty"><button data-minus="'+i+'" aria-label="Remove one '+esc(p.name)+'">−</button>'+item.qty+'<button data-plus="'+i+'" aria-label="Add one '+esc(p.name)+'">+</button></div></div>'}).join(""):'<div class="empty">Your order is empty.<br>Choose a drink to get started.</div>')+'</div><div class="totals"><div class="total-row"><span>Subtotal</span><span>'+money(total())+'</span></div><div class="total-row"><span>Discount</span><span>'+money(0)+'</span></div><div class="total-row"><span>Tax</span><span>Calculated at checkout</span></div></div><div class="grand"><span>Total</span><span>'+money(total())+'</span></div><button class="checkout" id="checkout" '+(!cart.length?"disabled":"")+'>Complete demo order</button><p class="notice" role="status" id="message">Prototype only · No payment is processed or stored on a server.</p></aside></div>'}
function total(){return cart.reduce((sum,item)=>{const p=products.find(p=>p.id===item.id);return sum+(p.price+sizes.find(s=>s.label===item.size).extra)*item.qty},0)}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.view){activeView=b.dataset.view;render()}else if(b.dataset.category){category=b.dataset.category;render()}else if(b.dataset.size){sizeChoice[b.dataset.size]=b.dataset.label;render()}else if(b.dataset.add){const size=sizeChoice[b.dataset.add]||"Tall";const item=cart.find(x=>x.id===b.dataset.add&&x.size===size);if(item)item.qty++;else cart.push({id:b.dataset.add,size,qty:1});render()}else if(b.dataset.plus!==undefined){cart[+b.dataset.plus].qty++;render()}else if(b.dataset.minus!==undefined){const i=+b.dataset.minus;cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1);render()}else if(b.id==="clear"){cart=[];render()}else if(b.id==="checkout"&&cart.length){orders.push({items:cart.reduce((n,x)=>n+x.qty,0),total:total()});cart=[];render();document.getElementById("message").textContent="Demo order completed. No real payment was taken."}});
document.getElementById("search").addEventListener("input",e=>{query=e.target.value;render()});
render();
</script></body></html>
